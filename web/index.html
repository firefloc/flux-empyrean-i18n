<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux Empyrean — traduction (expérimental)</title>
<style>
  /* Direction artistique reprise du jeu : un ciel de nuit sur une mer, le Flux
     en vert d'aurore, et la typographie de terminal des écrans du jeu. On reste
     sobre — c'est un outil de travail, pas une vitrine. */
  :root {
    --fond: #070c14; --panneau: #0d141f; --bord: #1c2a3d;
    --texte: #cfe0e8; --attenue: #6f8598; --accent: #6ee7a8;
    --accent-sourd: #2b6f52;
    --alerte: #f0b429; --erreur: #f2705d;
  }
  /* Le Flux : une lueur qui ne bouge pas, posée haut derrière le contenu. */
  body::before {
    content: ""; position: fixed; inset: -20vh 0 auto 0; height: 70vh; z-index: -1;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(110, 231, 168, .10), transparent 70%),
      radial-gradient(45% 40% at 78% 12%, rgba(70, 160, 220, .07), transparent 70%);
    pointer-events: none;
  }
  * { box-sizing: border-box; }
  /* `display: flex` sur .etape battait l'attribut hidden : la consigne réservée
     à Linux s'affichait sous Windows. Le masquage doit primer. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 15px/1.5 ui-monospace, "Cascadia Code", Menlo, monospace;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panneau);
    border-bottom: 1px solid var(--bord); padding: 12px 20px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .04em; }
  .titre { padding: 26px 20px 6px; max-width: 1600px; margin: 0 auto; }
  .titre h1 {
    font-size: 26px; margin: 0; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--texte);
    text-shadow: 0 0 24px rgba(110, 231, 168, .25);
  }
  .titre p { margin: 6px 0 0; color: var(--attenue); font-size: 13px; }
  .titre { position: relative; }
  .titre .flux { color: var(--accent); }
  .langue-ui { position: absolute; top: 26px; right: 20px; font-size: 12px; }
  .langue-avis { position: absolute; top: 56px; right: 20px; font-size: 11px;
    color: var(--alerte); max-width: 34ch; text-align: right; margin: 0; }
  .etiquette {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--alerte); border: 1px solid currentColor; border-radius: 3px;
    padding: 2px 7px; vertical-align: middle; margin-left: 10px;
    font-weight: 600; text-shadow: none;
  }
  button, select, input[type=search], input[type=text] {
    background: var(--fond); color: var(--texte); border: 1px solid var(--bord);
    border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled, input:disabled { opacity: .4; cursor: default; }
  button.primaire { background: var(--accent); color: #06120c; border-color: var(--accent); font-weight: 600; }
  .compteur { color: var(--attenue); font-size: 13px; margin-left: auto; }
  .brouillon { color: var(--attenue); font-size: 11px; width: 100%; text-align: right;
    min-height: 1em; }
  .reprise {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: rgba(110, 231, 168, .06); border: 1px solid var(--accent-sourd);
    border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px;
  }
  .reprise .actions { margin-left: auto; display: flex; gap: 8px; }
  #journal {
    width: 100%; font-size: 12px; color: var(--attenue);
    border-top: 1px solid var(--bord); padding-top: 8px; margin: 0;
  }
  main { padding: 20px; max-width: 1600px; margin: 0 auto; }
  .intro { background: var(--panneau); border: 1px solid var(--bord); border-radius: 6px; padding: 16px 20px; margin-bottom: 20px; }
  .intro h2 { font-size: 14px; margin: 0 0 8px; }
  .intro p { margin: 0 0 8px; color: var(--attenue); font-size: 13px; }
  .intro code { color: var(--accent); }
  /* Deux colonnes qui se répondent. L'original et sa traduction doivent occuper
     la même largeur, commencer à la même hauteur et se lire d'un seul coup d'œil
     — sinon la comparaison, qui est tout l'intérêt de l'écran, ne se fait pas. */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { text-align: left; font-size: 11px; color: var(--attenue); font-weight: 600;
       padding: 8px 14px; border-bottom: 1px solid var(--bord);
       text-transform: uppercase; letter-spacing: .08em; }
  th:nth-child(1), th:nth-child(2) { width: 46%; }
  th:nth-child(3) { width: 8%; }
  td { vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--bord); }
  tr:hover td { background: rgba(110, 231, 168, .025); }
  td.source {
    white-space: pre-wrap; color: var(--attenue); line-height: 1.55;
    border-left: 2px solid transparent;
  }
  td.cible { padding-left: 0; }
  td.etat { font-size: 11px; text-align: right; }
  textarea {
    width: 100%; background: #050a10; color: var(--texte);
    border: 1px solid var(--bord); border-radius: 4px; padding: 9px 12px;
    font: inherit; line-height: 1.55; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(110, 231, 168, .2); }
  textarea[readonly] { color: var(--attenue); background: #0a0c08;
    border-color: #2e2a12; cursor: not-allowed; }
  /* Une ligne gelée n'est pas une alerte : c'est du travail qu'on ne te demande
     pas. Elle se met en retrait plutôt qu'en avant. */
  tr.gele td.source { border-left-color: var(--alerte); }
  tr.figee { opacity: .45; }
  tr.figee:hover { opacity: .8; }
  tr.figee td.source { color: var(--alerte); }
  tr.figee td { background: rgba(240, 180, 41, .03); }
  .separateur { width: 1px; height: 20px; background: var(--bord); margin: 0 4px; }
  .champ-langue { font-size: 12px; color: var(--attenue); display: inline-flex;
    align-items: center; gap: 6px; }
  .champ-langue input { width: 5em; text-align: center; }
  .groupe { color: var(--accent); font-weight: 600; letter-spacing: .04em;
    padding-top: 22px !important; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
  .badge.gele { background: #3a2d0c; color: var(--alerte); }
  .badge.verrou { background: #3a1a15; color: var(--erreur); }
  .badge.ok { background: #123322; color: var(--accent); }
  .probleme { color: var(--erreur); font-size: 12px; margin-top: 4px; }
  .vide { text-align: center; color: var(--attenue); padding: 60px 20px; }
  nav { display: flex; gap: 8px; padding: 10px 20px 0; max-width: 1600px; margin: 0 auto;
        border-bottom: 1px solid var(--bord); }
  nav button { border-radius: 4px 4px 0 0; border-bottom-color: transparent; }
  nav button[aria-selected=true] { background: var(--panneau); border-color: var(--bord);
    border-bottom-color: var(--panneau); color: var(--accent); font-weight: 600;
    box-shadow: inset 0 2px 0 var(--accent-sourd); }
  .panneau { background: linear-gradient(180deg, rgba(110,231,168,.03), transparent 40%),
    var(--panneau); border: 1px solid var(--bord); border-radius: 8px;
    padding: 22px 26px; margin-bottom: 20px; }
  .panneau h2 { font-size: 15px; margin: 0 0 12px; }
  .panneau p { color: var(--attenue); font-size: 13px; margin: 0 0 10px; }
  .panneau code { color: var(--accent); }
  .etape { display: flex; gap: 14px; align-items: baseline; margin: 14px 0; }
  .etape .num { color: var(--accent); font-weight: 600; min-width: 1.4em; }
  .etape .corps { flex: 1; }
  .chapo { font-size: 14px; color: var(--texte); opacity: .8; max-width: 78ch; }
  .fiches { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    margin: 22px 0; }
  .fiche { position: relative; background: #0a121b; border: 1px solid var(--bord);
    border-radius: 8px; padding: 20px 22px 20px 56px; }
  .fiche h3 { font-size: 14px; margin: 0 0 8px; letter-spacing: .03em; }
  .fiche p { margin: 0 0 10px; font-size: 13px; color: var(--attenue); }
  .fiche .detail { font-size: 12px; line-height: 1.6; color: #5e7387; }
  .fiche .detail.alerte { color: #b08a3a; }
  .fiche a { color: var(--accent); }
  .fiche .chiffre {
    position: absolute; left: 18px; top: 18px; width: 26px; height: 26px;
    display: grid; place-items: center; border-radius: 50%;
    border: 1px solid var(--accent-sourd); color: var(--accent);
    font-size: 12px; font-weight: 600;
  }
  .fiche .valeur { color: var(--accent); }
  .depose { display: block; font-size: 12px; color: var(--attenue); margin-top: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .repli { margin-top: 24px; border-top: 1px solid var(--bord); padding-top: 16px; }
  .repli summary { cursor: pointer; font-size: 13px; color: var(--attenue); }
  .repli summary:hover { color: var(--accent); }
  .repli p { font-size: 13px; color: var(--attenue); margin: 12px 0; }
  .repli pre { background: #050a10; border: 1px solid var(--bord); border-radius: 4px;
    padding: 12px 14px; font-size: 12px; color: var(--texte); overflow-x: auto; }
  .commande { background: #050a10; border: 1px solid var(--accent-sourd); border-radius: 4px;
    padding: 8px 12px; font-size: 13px; color: var(--accent); user-select: all;
    display: inline-block; margin: 4px 0; }
  .commande.copiable { cursor: pointer; position: relative; }
  .commande.copiable:hover { border-color: var(--accent); }
  .commande.copiable::after { content: attr(data-etat); position: absolute; left: 100%;
    margin-left: 10px; color: var(--attenue); font-size: 11px; white-space: nowrap; }
  .fiche.large { grid-column: 1 / -1; }
  .marche { margin: 10px 0 0; padding-left: 20px; font-size: 13px; color: var(--attenue); }
  .marche li { margin-bottom: 10px; }
  .marche a { color: var(--accent); }
</style>
</head>
<body>
<div class="titre">
  <h1><span class="flux">Flux</span> <span data-t="entete.titre"></span>
    <span class="etiquette" data-t="entete.etiquette"></span></h1>
  <p data-t="entete.accroche"></p>
  <select id="langue-ui" class="langue-ui" aria-label="Interface language"></select>
  <p id="langue-avis" class="langue-avis" hidden></p>
</div>

<nav>
  <button id="onglet-installer" aria-selected="true" data-t="onglet.installer"></button>
  <button id="onglet-traduire" aria-selected="false" data-t="onglet.traduire"></button>
</nav>

<main id="vue-installer">
  <div class="panneau">
    <h2 data-t="inst.titre"></h2>
    <p class="chapo"><span data-t="inst.chapo.1"></span><strong data-t="inst.chapo.fort"></strong><span data-t="inst.chapo.2"></span></p>

    <div class="fiches">
      <div class="fiche">
        <span class="chiffre">1</span>
        <h3 data-t="inst.1.titre"></h3>
        <p><a href="https://github.com/GDPatch/GDPatch/releases/latest" target="_blank"
              rel="noopener">GDPatch</a><span data-t="inst.1.corps.1"></span></p>
        <p class="detail" data-t="inst.1.detail"></p>
        <label class="depose"><span data-t="inst.1.depose"></span>
          <input type="file" id="install-chargeur"></label>
      </div>

      <div class="fiche">
        <span class="chiffre">2</span>
        <h3 data-t="inst.2.titre"></h3>
        <p data-t="inst.2.corps"></p>
        <p class="detail" data-t="inst.2.detail"></p>
        <div class="actions">
          <select id="install-langue"><option>…</option></select>
          <button id="install-poser" class="primaire" disabled data-t="inst.2.bouton"></button>
        </div>
      </div>
    </div>

    <p id="install-journal" hidden></p>

    <div id="install-suite" hidden>
      <div class="fiches">
        <div class="fiche">
          <span class="chiffre">3</span>
          <h3 data-t="inst.3.titre"></h3>
          <p data-t="inst.3.corps"></p>
          <p class="detail"><span data-t="inst.3.detail"></span><span id="install-plateforme" class="valeur"></span></p>
        </div>

        <div class="fiche">
          <span class="chiffre">F1</span>
          <h3 data-t="inst.5.titre"></h3>
          <p data-t="inst.5.corps"></p>
        </div>

        <div class="fiche large" id="install-steam" hidden>
          <span class="chiffre">4</span>
          <h3 data-t="inst.4.titre"></h3>
          <p data-t="inst.4.linux.intro"></p>
          <ol class="marche">
            <li><span data-t="inst.4.linux.etape1"></span>
              <a href="https://gdpatch.dev/using/install/linux" target="_blank"
                 rel="noopener">gdpatch.dev</a><span data-t="inst.4.linux.etape1b"></span></li>
            <li data-t="inst.4.linux.etape2"></li>
            <li><span data-t="inst.4.linux.etape3"></span>
              <span class="commande copiable" data-copier>./run_with_gdpatch.sh %command%</span></li>
          </ol>
          <p class="detail" data-t="inst.4.linux.detail"></p>
        </div>

        <div class="fiche large" id="install-proton" hidden>
          <span class="chiffre">4</span>
          <h3 data-t="inst.4.titre"></h3>
          <p data-t="inst.4.proton"></p>
          <span class="commande copiable" data-copier>WINEDLLOVERRIDES="winmm=n,b" %command%</span>
          <p class="detail" data-t="inst.4.proton.detail"></p>
          <p class="detail alerte" data-t="inst.4.proton.avertissement"></p>
        </div>
      </div>
    </div>

    <details class="repli">
      <summary data-t="inst.repli.titre"></summary>
      <p data-t="inst.repli.1"></p>
      <pre>GDPatch/mods/flux_&lt;langue&gt;/
winmm.dll</pre>
      <p data-t="inst.repli.2"></p>
      <p data-t="inst.repli.3"></p>
      <p class="detail" data-t="inst.repli.4"></p>
    </details>
  </div>
</main>

<div id="vue-traduire" hidden>
<header>
  <button id="charger-source" data-t="trad.ouvrir"></button>
  <select id="charger-publiee" disabled>
    <option value="" data-t="trad.repartir"></option>
  </select>
  <button id="charger-langue" disabled data-t="trad.fichiers" data-t-title="trad.fichiers.titre"></button>
  <span class="separateur"></span>
  <select id="flux" disabled>
    <option value="documents" data-t="trad.flux.documents"></option>
    <option value="scenes" data-t="trad.flux.scenes"></option>
    <option value="scripts" data-t="trad.flux.scripts"></option>
  </select>
  <input type="search" id="filtre" data-t-placeholder="trad.filtre" disabled>
  <label style="font-size:13px;color:var(--attenue)">
    <input type="checkbox" id="restants"> <span data-t="trad.restants"></span>
  </label>
  <span class="separateur"></span>
  <label class="champ-langue"><span data-t="trad.langue"></span>
    <input type="text" id="code-langue" value="fr" maxlength="7" disabled></label>
  <button id="telecharger" disabled data-t="trad.telecharger"></button>
  <button id="contribuer" class="primaire" disabled data-t="trad.contribuer"></button>
  <span class="compteur" id="compteur"></span>
  <span class="brouillon" id="brouillon"></span>
  <p id="journal" hidden></p>
</header>

<main>
  <div class="reprise" id="reprise" hidden>
    <span id="reprise-texte"></span>
    <span class="actions">
      <button id="reprise-oui" class="primaire" data-t="reprise.oui"></button>
      <button id="reprise-non" data-t="reprise.non"></button>
    </span>
  </div>

  <div class="intro" id="intro">
    <h2 data-t="intro.titre"></h2>
    <p data-t="intro.1"></p>
    <p data-t="intro.2"></p>
    <p data-t="intro.3"></p>
    <p style="color:var(--alerte)" data-t="intro.gel"></p>
  </div>
  <div id="table-zone"></div>
</main>
</div>

<script>
  // Deux publics, deux vues. Le joueur arrive en premier : c'est lui qui compte.
  const vues = { installer: "vue-installer", traduire: "vue-traduire" };
  for (const [nom, id] of Object.entries(vues)) {
    document.getElementById("onglet-" + nom).onclick = () => {
      for (const [autre, cible] of Object.entries(vues)) {
        const actif = autre === nom;
        document.getElementById(cible).hidden = !actif;
        document.getElementById("onglet-" + autre).setAttribute("aria-selected", String(actif));
      }
    };
  }
</script>
<script src="i18n.js"></script>
<script>
  // Le sélecteur de langue de l'interface, avant tout le reste : les deux
  // modules qui suivent construisent déjà des textes traduits.
  (() => {
    const select = document.getElementById("langue-ui");
    for (const [code, nom] of Object.entries(LANGUES_UI)) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = nom;
      select.appendChild(option);
    }
    select.value = LANGUE;
    select.onchange = (e) => changerLangue(e.target.value);
    demarrerI18n();
  })();
</script>
<script>
  // Une commande à coller se copie d'un clic. La coller à la main depuis une
  // page web est le genre de friction qui fait abandonner à la dernière étape.
  document.addEventListener("click", async (evenement) => {
    const cible = evenement.target.closest("[data-copier]");
    if (!cible) return;
    try {
      await navigator.clipboard.writeText(cible.textContent.trim());
      cible.dataset.etat = t("inst.copie");
    } catch {
      // Presse-papiers refusé : la sélection reste possible, on le dit.
      cible.dataset.etat = t("inst.copie.echec");
    }
    setTimeout(() => (cible.dataset.etat = ""), 2500);
  });
</script>
<script src="installeur.js"></script>
<script src="vendor/fzstd.js"></script>
<script src="pack.js"></script>
<script src="extraction.js"></script>
<script src="editeur.js"></script>
</body>
</html>
